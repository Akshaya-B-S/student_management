<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Score Prediction</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Student Score Prediction</h1>
        <p>Enter the student's details to predict their math score.</p>

        <form id="predictionForm">

            <label for="gender">Gender</label>
            <select id="gender" required>
                <option value="">Select gender</option>
                <option value="female">Female</option>
                <option value="male">Male</option>
            </select>

            <label for="race">Race / Ethnicity</label>
            <select id="race" required>
                <option value="">Select group</option>
                <option value="group A">Group A</option>
                <option value="group B">Group B</option>
                <option value="group C">Group C</option>
                <option value="group D">Group D</option>
                <option value="group E">Group E</option>
            </select>

            <label for="education">Parental Level of Education</label>
            <select id="education" required>
                <option value="">Select education</option>
                <option value="some high school">Some high school</option>
                <option value="high school">High school</option>
                <option value="some college">Some college</option>
                <option value="associate's degree">Associate's degree</option>
                <option value="bachelor's degree">Bachelor's degree</option>
                <option value="master's degree">Master's degree</option>
            </select>

            <label for="lunch">Lunch Type</label>
            <select id="lunch" required>
                <option value="">Select lunch type</option>
                <option value="standard">Standard</option>
                <option value="free/reduced">Free / Reduced</option>
            </select>

            <label for="preparation">Test Preparation Course</label>
            <select id="preparation" required>
                <option value="">Select preparation status</option>
                <option value="completed">Completed</option>
                <option value="none">None</option>
            </select>

            <label for="reading">Reading Score (0–100)</label>
            <input type="number" id="reading"
                   min="0" max="100" step="1" required>

            <label for="writing">Writing Score (0–100)</label>
            <input type="number" id="writing"
                   min="0" max="100" step="1" required>

            <button type="submit" id="predictButton">Predict Math Score</button>
        </form>

        <div id="result" role="status" aria-live="polite"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
